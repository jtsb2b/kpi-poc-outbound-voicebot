[project]
name = "kpi-voicebot"
version = "0.1.0"
description = "KPI outbound voicebot POC: policy confirmation and accident-service survey"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pymongo>=4.18",
    "openpyxl>=3.1.5",
    "phonenumbers>=9.0",
    "pyyaml>=6.0.3",
    "python-multipart>=0.0.32",
    "httpx>=0.28",
    "google-genai>=1.50",
    "websockets>=16.1.1",
    "certifi>=2026.7.22",
    "livekit>=1.1.20",
    "livekit-api>=1.2.1",
    "livekit-agents>=1.8.6",
    "livekit-plugins-silero>=1.8.6",
    "livekit-plugins-soniox>=1.8.6",
    "livekit-plugins-ai-coustics>=0.3.0",
]

[project.scripts]
kpi-api = "kpi_voicebot.api:main"
kpi-worker = "kpi_voicebot.worker:main"
kpi-sim = "kpi_voicebot.simulator:main"
kpi-tts = "kpi_voicebot.voice_cli:main"
kpi-call = "kpi_voicebot.telephony:main"
kpi-roleplay = "kpi_voicebot.roleplay:main"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
    "mongomock-motor>=0.0.36",
    "ruff>=0.16",
    "mypy>=2.4",
    "types-PyYAML",
    "sounddevice>=0.5.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kpi_voicebot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["kpi_voicebot"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["openpyxl.*", "phonenumbers.*"]
ignore_missing_imports = true

server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS, asked again every 10 s: a rebuilt API container gets a new address, and nginx resolving it
    # only at startup answered 502 after every API rebuild (28 Oct 2026).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The app calls the API on its own origin, as the Vite dev server proxies it.
    location ~ ^/(api|health|ready) {
        set $api http://kpi-voicebot-api:8000;
        proxy_pass $api;
        proxy_set_header Host $host;
        client_max_body_size 10m;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
